<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#1a1f35"/>
  <!-- ears -->
  <circle cx="28" cy="32" r="13" fill="#222"/>
  <circle cx="72" cy="32" r="13" fill="#222"/>
  <!-- head -->
  <circle cx="50" cy="58" r="26" fill="#f0f0f0"/>
  <!-- eye patches -->
  <ellipse cx="38" cy="54" rx="9" ry="8" fill="#222" transform="rotate(-10 38 54)"/>
  <ellipse cx="62" cy="54" rx="9" ry="8" fill="#222" transform="rotate(10 62 54)"/>
  <!-- eyes -->
  <circle cx="38" cy="54" r="4" fill="white"/>
  <circle cx="62" cy="54" r="4" fill="white"/>
  <circle cx="39" cy="53" r="2.5" fill="#111"/>
  <circle cx="63" cy="53" r="2.5" fill="#111"/>
  <circle cx="40" cy="52" r="1" fill="white"/>
  <circle cx="64" cy="52" r="1" fill="white"/>
  <!-- muzzle -->
  <ellipse cx="50" cy="68" rx="11" ry="8" fill="#ddd"/>
  <!-- nose -->
  <ellipse cx="50" cy="65" rx="4" ry="3" fill="#333"/>
  <!-- mouth -->
  <path d="M47 68 Q50 72 53 68" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>