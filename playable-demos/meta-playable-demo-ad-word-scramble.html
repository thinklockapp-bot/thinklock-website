<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b16">
  <title>Word Scramble | ThinkLock</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070b16;
      color: #fff;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% -10%, #24335f 0%, #10172b 42%, #070b16 100%);
    }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible { outline: 3px solid #5eead4; outline-offset: 3px; }
    .tl-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    .tl-main { width: 100%; max-width: 450px; }
    .tl-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .tl-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -.02em;
    }
    .tl-brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(135deg, #5eead4, #7c3aed);
      font-size: 20px;
    }
    .tl-kicker {
      color: rgba(255,255,255,.48);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .tl-card {
      padding: 20px;
      border: 1px solid rgba(148,163,184,.18);
      border-radius: 26px;
      background: rgba(15,23,42,.92);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    .tl-lock-screen { padding: 18px 2px 8px; text-align: center; }
    .tl-lock-icon {
      display: inline-block;
      margin: 4px 0 18px;
      font-size: 70px;
      line-height: 1;
      transform-origin: 50% 80%;
      animation: tl-lock-jiggle 2.1s ease-in-out infinite;
    }
    .tl-lock-title {
      margin: 0;
      color: #ff334f;
      font-size: clamp(29px, 8vw, 38px);
      font-weight: 950;
      line-height: 1.08;
      letter-spacing: -.04em;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255,51,79,.9), 0 0 26px rgba(255,51,79,.72), 0 0 52px rgba(239,68,68,.52);
      animation: tl-lock-title-alarm 1.1s ease-in-out infinite;
    }
    .tl-demo-note { margin: 10px 0 0; color: rgba(255,255,255,.64); font-size: 15px; font-weight: 650; }
    .tl-lock-copy {
      max-width: 310px;
      margin: 28px auto 0;
      color: rgba(255,255,255,.86);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.45;
    }
    .tl-start-button {
      width: 100%;
      margin-top: 30px;
      padding: 16px 18px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #14b8a6, #7c3aed);
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 850;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(20,184,166,.28);
      animation: tl-button-pulse 1.55s ease-in-out infinite;
    }
    .tl-start-button:active { transform: scale(.97); }
    .tl-game { position: relative; }
    .tl-game-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
    }
    .tl-label {
      margin: 0;
      color: rgba(255,255,255,.58);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .tl-game-title { margin: 4px 0 0; color: #fff; font-size: 19px; font-weight: 850; }
    .tl-status { flex-shrink: 0; text-align: right; }
    .tl-status-main { color: #4ade80; font-size: 17px; font-weight: 900; line-height: 1; }
    .tl-status-note { margin-top: 5px; color: rgba(255,255,255,.55); font-size: 11px; }
    .tl-clue {
      min-height: 20px;
      margin: 0 0 7px;
      color: #c4b5fd;
      font-size: 13px;
      font-style: italic;
      text-align: center;
    }
    .tl-retry {
      max-width: 300px;
      margin: 0 auto 10px;
      padding: 7px 14px;
      border: 1.5px solid rgba(245,158,11,.5);
      border-radius: 12px;
      background: rgba(245,158,11,.18);
      color: #fbbf24;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }
    .tl-board {
      display: grid;
      justify-content: center;
      gap: 3px;
      margin: 0 auto 11px;
    }
    .tl-board-cell, .tl-board-spacer { width: var(--cell-size); height: var(--cell-size); }
    .tl-board-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 2px solid rgba(255,255,255,.12);
      border-radius: 6px;
      background: rgba(255,255,255,.06);
      color: #e5e7eb;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .tl-board-cell.active { border-color: var(--active-color); background: var(--active-tint); color: #fff; }
    .tl-board-cell.intersection { border-color: #facc1588; background: rgba(250,204,21,.08); color: #fde047; }
    .tl-board-cell.solved { border-color: #22c55e; background: rgba(34,197,94,.18); color: #4ade80; }
    .tl-board-cell.wrong { border-color: #ef4444; background: rgba(239,68,68,.2); color: #fca5a5; animation: tl-shake .35s ease; }
    .tl-answer {
      display: flex;
      justify-content: center;
      gap: 4px;
      min-height: 36px;
      margin: 7px 0;
      padding: 0 8px;
    }
    .tl-answer-slot {
      display: flex;
      width: var(--answer-size);
      height: 36px;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 2px dashed rgba(255,255,255,.15);
      border-radius: 7px;
      background: transparent;
      color: rgba(255,255,255,.15);
      font-size: 14px;
      font-weight: 800;
    }
    .tl-answer-slot.filled {
      border-style: solid;
      border-color: var(--active-color);
      background: var(--active-tint);
      color: #fff;
      cursor: pointer;
    }
    .tl-letters {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 11px;
      padding: 0 8px;
    }
    .tl-letter {
      display: flex;
      width: var(--tile-size);
      height: var(--tile-size);
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid rgba(255,255,255,.22);
      border-top-color: rgba(255,255,255,.4);
      border-radius: var(--tile-radius);
      background: linear-gradient(160deg, var(--tile-top), var(--tile-bottom));
      color: #fff;
      font-size: var(--tile-font);
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 1px 3px rgba(0,0,0,.5);
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0,0,0,.5), 0 0 10px var(--tile-glow);
      touch-action: manipulation;
    }
    .tl-letter.used, .tl-letter:disabled {
      border: 0;
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.2);
      cursor: default;
      box-shadow: none;
      text-shadow: none;
    }
    .tl-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin-bottom: 9px; }
    .tl-control {
      padding: 6px 10px;
      border: 1px solid rgba(167,139,250,.25);
      border-radius: 999px;
      background: rgba(167,139,250,.15);
      color: #c4b5fd;
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    .tl-control.skip { border-color: rgba(234,88,12,.3); background: rgba(234,88,12,.18); color: #fed7aa; }
    .tl-control:disabled { opacity: .5; cursor: default; }
    .tl-control:active, .tl-letter:active { transform: scale(.97); }
    .tl-progress {
      display: flex;
      align-items: center;
      gap: 6px;
      width: max-content;
      margin: 0 auto;
      padding: 4px 12px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      background: rgba(255,255,255,.05);
    }
    .tl-dot { width: 10px; height: 10px; border-radius: 50%; transition: background .3s; }
    .tl-progress-count { margin-left: 2px; color: rgba(255,255,255,.4); font-size: 12px; }
    .tl-word-splash {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 8;
      color: #86efac;
      font-size: 28px;
      font-weight: 950;
      pointer-events: none;
      text-shadow: 0 0 14px rgba(74,222,128,.8);
      animation: tl-word-splash .65s ease-out forwards;
    }
    .tl-intro-overlay {
      position: absolute;
      inset: -8px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      border-radius: 24px;
      background: rgba(7,11,22,.96);
      backdrop-filter: blur(8px);
    }
    .tl-intro-card {
      width: 100%;
      padding: 24px 18px;
      border: 1px solid rgba(167,139,250,.5);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(124,58,237,.18), rgba(15,23,42,.98));
      box-shadow: 0 18px 45px rgba(124,58,237,.18);
      text-align: center;
      animation: tl-intro-card .42s ease-out both;
    }
    .tl-intro-eyebrow { margin: 0; color: #99f6e4; font-size: 11px; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    .tl-intro-card h2 { margin: 9px 0 4px; color: #fff; font-size: 22px; font-weight: 900; letter-spacing: -.03em; }
    .tl-intro-icon {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      margin: 16px auto 11px;
      border: 2px solid rgba(167,139,250,.55);
      border-radius: 50%;
      background: rgba(124,58,237,.16);
      font-size: 45px;
      animation: tl-intro-pulse .9s ease-in-out infinite;
    }
    .tl-intro-copy { margin: 0; color: rgba(255,255,255,.62); font-size: 13px; line-height: 1.45; }
    .tl-complete { padding: 14px 2px 4px; text-align: center; }
    .tl-unlock-stage { position: relative; width: 92px; height: 92px; margin: 0 auto 10px; }
    .tl-final-lock { position: absolute; inset: 0; display: grid; place-items: center; font-size: 62px; line-height: 1; }
    .tl-final-lock.closed { animation: tl-lock-bust 1.35s ease-out .5s forwards; }
    .tl-final-lock.open { opacity: 0; animation: tl-lock-open 1.35s cubic-bezier(.2,.9,.25,1.25) .5s forwards; }
    .tl-unlock-burst {
      position: absolute;
      inset: 12px;
      border: 4px solid #5eead4;
      border-radius: 50%;
      opacity: 0;
      animation: tl-unlock-burst 1.35s ease-out .5s forwards;
    }
    .tl-complete-label { color: #5eead4; font-size: 12px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    .tl-complete h1 { margin: 8px 0 16px; font-size: 30px; line-height: 1.08; letter-spacing: -.04em; }
    .tl-result { padding: 14px 12px; border: 1px solid rgba(94,234,212,.24); border-radius: 16px; background: rgba(20,184,166,.1); }
    .tl-score { margin: 0; color: #99f6e4; font-size: 22px; font-weight: 900; }
    .tl-rank { margin: 6px 0 0; color: rgba(255,255,255,.76); font-size: 14px; line-height: 1.4; }
    .tl-tagline { max-width: 340px; margin: 20px auto 0; color: rgba(255,255,255,.9); font-size: 17px; font-weight: 850; line-height: 1.45; }
    .tl-tagline span { display: block; }
    .tl-action {
      display: block;
      margin-top: 22px;
      padding: 14px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, #14b8a6, #7c3aed);
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 850;
      box-shadow: 0 0 22px rgba(94,234,212,.45), 0 0 48px rgba(124,58,237,.4);
      animation: tl-final-cta-pulse 1.15s ease-in-out infinite;
    }
    .tl-footer-note { margin: 17px auto 0; color: rgba(255,255,255,.34); font-size: 11px; line-height: 1.5; text-align: center; }
    @keyframes tl-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    @keyframes tl-word-splash { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.4); } 35% { opacity: 1; transform: translate(-50%,-60%) scale(1.2); } 100% { opacity: 0; transform: translate(-50%,-110%) scale(.9); } }
    @keyframes tl-intro-card { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes tl-intro-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14); } }
    @keyframes tl-lock-jiggle { 0%,72%,100% { transform: rotate(0) translateX(0); } 78% { transform: rotate(-4deg) translateX(-2px); } 84% { transform: rotate(4deg) translateX(2px); } 90% { transform: rotate(-2deg) translateX(-1px); } 96% { transform: rotate(2deg) translateX(1px); } }
    @keyframes tl-button-pulse { 0%,100% { transform: scale(1); box-shadow: 0 10px 30px rgba(20,184,166,.24); } 50% { transform: scale(1.025); box-shadow: 0 14px 38px rgba(124,58,237,.42); } }
    @keyframes tl-lock-title-alarm {
      0%,100% { transform: scale(1); color: #ff334f; text-shadow: 0 0 9px rgba(255,51,79,.8), 0 0 24px rgba(255,51,79,.62), 0 0 46px rgba(239,68,68,.42); }
      45% { transform: scale(1.075); color: #ff7588; text-shadow: 0 0 14px rgba(255,117,136,1), 0 0 38px rgba(255,51,79,.95), 0 0 78px rgba(239,68,68,.82); }
      60% { transform: scale(1.025); color: #ff4961; }
    }
    @keyframes tl-lock-bust { 0%,34% { opacity: 1; transform: rotate(0) scale(1); } 40% { transform: rotate(-7deg) scale(1.03); } 47% { transform: rotate(7deg) scale(1.06); } 54% { transform: rotate(-5deg) scale(1.09); } 61% { opacity: 1; transform: rotate(5deg) scale(1.16); } 70%,100% { opacity: 0; transform: rotate(0) scale(1.75); } }
    @keyframes tl-lock-open { 0%,67% { opacity: 0; transform: scale(.35) rotate(-12deg); } 78% { opacity: 1; transform: scale(1.28) rotate(4deg); } 90% { transform: scale(.92) rotate(-2deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes tl-unlock-burst { 0%,58% { opacity: 0; transform: scale(.25); } 68% { opacity: .95; } 100% { opacity: 0; transform: scale(1.8); } }
    @keyframes tl-final-cta-pulse { 0%,100% { transform: scale(1); box-shadow: 0 0 20px rgba(94,234,212,.42), 0 0 42px rgba(124,58,237,.34); } 50% { transform: scale(1.045); box-shadow: 0 0 32px rgba(94,234,212,.78), 0 0 68px rgba(124,58,237,.7); } }
    @media (prefers-reduced-motion: reduce) {
      .tl-lock-icon, .tl-lock-title, .tl-start-button, .tl-intro-card, .tl-intro-icon, .tl-final-lock, .tl-unlock-burst, .tl-action, .tl-word-splash { animation: none; }
      .tl-final-lock.closed { display: none; }
      .tl-final-lock.open { opacity: 1; }
    }
    @media (min-width: 560px) { .tl-card { padding: 28px; } }
    @media (max-height: 700px) {
      .tl-page { place-items: start center; }
      .tl-card { padding: 16px; }
      .tl-header { margin-bottom: 12px; }
    }
  </style>
</head>
<body>
  <div class="tl-page">
    <main class="tl-main">
      <header class="tl-header">
        <a class="tl-brand" href="https://www.thinklock.net/" aria-label="ThinkLock home">
          <span class="tl-brand-mark" aria-hidden="true">🧠</span>
          <span>ThinkLock</span>
        </a>
        <span class="tl-kicker">Quick brain break</span>
      </header>
      <section class="tl-card" id="app" aria-live="polite"></section>
      <p class="tl-footer-note">ThinkLock helps you pause, play, and choose what gets your attention.</p>
    </main>
  </div>
  <script>
    (() => {
      "use strict";

      const DEFAULT_CTA_URL = /Android/i.test(navigator.userAgent)
        ? "https://play.google.com/store/apps/details?id=com.thinklock.app"
        : (/iPhone|iPad|iPod/i.test(navigator.userAgent) ||
           (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1))
          ? "https://apps.apple.com/us/app/thinklock-brain-games/id6755414121"
          : "https://www.thinklock.net/";
      const INTRO_DURATION_MS = 3500;
      const ARM_COLORS = [
        { active: "#22d3ee", dim: "rgba(34,211,238,.20)", tileTop: "#22b8d4", tileBot: "#0891b2", glow: "rgba(34,211,238,.45)" },
        { active: "#a78bfa", dim: "rgba(167,139,250,.20)", tileTop: "#9f7aea", tileBot: "#7c3aed", glow: "rgba(167,139,250,.45)" },
        { active: "#fb923c", dim: "rgba(251,146,60,.20)", tileTop: "#f97316", tileBot: "#ea580c", glow: "rgba(251,146,60,.45)" }
      ];
      const PUZZLES = [
        { words: [
          { word: "BRAIN", hint: "What ThinkLock helps you train", dir: "h", row: 4, col: 3 },
          { word: "SPARK", hint: "A bright idea", dir: "v", row: 1, col: 4 },
          { word: "FOCUS", hint: "Stay on task", dir: "h", row: 1, col: 0 }
        ]},
        { words: [
          { word: "FOCUS", hint: "Stay on task", dir: "h", row: 5, col: 3 },
          { word: "SCORE", hint: "Points in a game", dir: "v", row: 3, col: 4 },
          { word: "SPARK", hint: "A bright idea", dir: "h", row: 3, col: 4 }
        ]},
        { words: [
          { word: "QUICK", hint: "Fast on your feet", dir: "h", row: 5, col: 3 },
          { word: "THINK", hint: "Use your mind", dir: "v", row: 3, col: 5 },
          { word: "TAP", hint: "Touch the screen", dir: "h", row: 3, col: 5 }
        ]},
        { words: [
          { word: "LEVEL", hint: "A stage of progress", dir: "h", row: 5, col: 3 },
          { word: "SPEED", hint: "How fast you move", dir: "v", row: 3, col: 4 },
          { word: "WORDS", hint: "Things you spell", dir: "h", row: 3, col: 0 }
        ]},
        { words: [
          { word: "POWER", hint: "Inner strength", dir: "h", row: 5, col: 3 },
          { word: "WORDS", hint: "Things you spell", dir: "v", row: 5, col: 5 },
          { word: "SCORE", hint: "Points in a game", dir: "h", row: 9, col: 5 }
        ]}
      ];

      const params = new URLSearchParams(window.location.search);
      const requestedVariant = Number.parseInt(params.get("variant") || "", 10);
      const variantIndex = Number.isFinite(requestedVariant)
        ? ((requestedVariant % PUZZLES.length) + PUZZLES.length) % PUZZLES.length
        : Math.floor(Math.random() * PUZZLES.length);
      const puzzle = PUZZLES[variantIndex];
      const app = document.getElementById("app");
      const ctaUrl = safeUrl(params.get("cta"));
      let scrambled = [];
      let inputs = [];
      let solved = [];
      let activeWord = 0;
      let retryQueue = [];
      let retryPhase = false;
      let wrongWord = null;
      let transitionId = null;
      let introId = null;
      let started = false;
      let finished = false;

      function safeUrl(value) {
        if (!value) return DEFAULT_CTA_URL;
        try {
          const parsed = new URL(value, window.location.href);
          if (parsed.protocol === "http:" || parsed.protocol === "https:") return value;
        } catch {
          // Use the device-appropriate ThinkLock destination.
        }
        return DEFAULT_CTA_URL;
      }

      function shuffleTiles(word) {
        const original = word.split("").map((letter, idx) => ({ idx, letter }));
        let result = original.slice();
        let attempts = 0;
        do {
          result = original.slice();
          for (let index = result.length - 1; index > 0; index -= 1) {
            const swapIndex = Math.floor(Math.random() * (index + 1));
            [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
          }
          attempts += 1;
        } while (attempts < 50 && result.every((tile, index) => tile.idx === index));
        return result;
      }

      function resetGameState() {
        scrambled = puzzle.words.map((word) => shuffleTiles(word.word));
        inputs = puzzle.words.map(() => []);
        solved = puzzle.words.map(() => false);
        activeWord = 0;
        retryQueue = [];
        retryPhase = false;
        wrongWord = null;
        started = false;
        finished = false;
      }

      function renderLockScreen() {
        app.innerHTML = `
          <div class="tl-lock-screen">
            <div class="tl-lock-icon" aria-hidden="true">🔒</div>
            <h1 class="tl-lock-title">YOUR APPS ARE NOW LOCKED!</h1>
            <p class="tl-demo-note">(JK, this is only a demo)</p>
            <p class="tl-lock-copy">Complete the challenge to unlock your apps</p>
            <p class="tl-demo-note">(This is how our app-lock feature works)</p>
            <button class="tl-start-button" id="start-challenge" type="button">Complete Challenge</button>
          </div>`;
        document.getElementById("start-challenge").addEventListener("click", () => {
          resetGameState();
          renderGame(true);
          introId = window.setTimeout(() => {
            started = true;
            const intro = document.getElementById("intro");
            if (intro) intro.remove();
          }, INTRO_DURATION_MS);
        });
      }

      function cellFor(word, index) {
        return word.dir === "h" ? [word.row, word.col + index] : [word.row + index, word.col];
      }

      function buildBoard() {
        const cellMap = new Map();
        let minRow = Infinity;
        let maxRow = -Infinity;
        let minCol = Infinity;
        let maxCol = -Infinity;
        puzzle.words.forEach((word, wordIndex) => {
          word.word.split("").forEach((letter, letterIndex) => {
            const [row, col] = cellFor(word, letterIndex);
            const key = `${row},${col}`;
            const entries = cellMap.get(key) || [];
            entries.push({ wordIndex, letterIndex, letter });
            cellMap.set(key, entries);
            minRow = Math.min(minRow, row);
            maxRow = Math.max(maxRow, row);
            minCol = Math.min(minCol, col);
            maxCol = Math.max(maxCol, col);
          });
        });
        return { cellMap, minRow, maxRow, minCol, maxCol };
      }

      function getBoardSizing(board) {
        const cols = board.maxCol - board.minCol + 1;
        const rows = board.maxRow - board.minRow + 1;
        const maxWidth = Math.min(340, window.innerWidth - 64);
        const maxGridHeight = Math.max(132, Math.floor(window.innerHeight * .46) - 60);
        const byWidth = Math.min(42, Math.floor((maxWidth - 3 * (cols - 1)) / cols));
        const byHeight = Math.floor((maxGridHeight - 3 * (rows - 1)) / rows);
        return { cols, rows, cellSize: Math.max(20, Math.min(byWidth, byHeight)) };
      }

      function cellLetter(entries) {
        for (const entry of entries) {
          if (solved[entry.wordIndex]) return puzzle.words[entry.wordIndex].word[entry.letterIndex];
          if (inputs[entry.wordIndex][entry.letterIndex]) return inputs[entry.wordIndex][entry.letterIndex].letter;
        }
        return "";
      }

      function selectCell(entries) {
        if (!started || finished) return;
        const available = entries.map((entry) => entry.wordIndex).filter((index, position, all) => !solved[index] && all.indexOf(index) === position);
        if (!available.length) return;
        const current = available.indexOf(activeWord);
        activeWord = available[current < 0 ? 0 : (current + 1) % available.length];
        renderGame(false);
      }

      function renderGame(showIntro) {
        if (finished) return;
        app.innerHTML = `
          <section class="tl-game" aria-label="Word Scramble challenge">
            <div class="tl-game-head">
              <div>
                <p class="tl-label">Word Scramble</p>
                <p class="tl-game-title">Solve the crossword</p>
              </div>
              <div class="tl-status">
                <div class="tl-status-main">${started ? "PLAY" : "READY"}</div>
                <div class="tl-status-note">${solved.filter(Boolean).length}/${puzzle.words.length} words</div>
              </div>
            </div>
            <p class="tl-clue" id="clue"></p>
            <div class="tl-retry" id="retry" hidden></div>
            <div class="tl-board" id="board" aria-label="Word Scramble crossword board"></div>
            <div class="tl-answer" id="answer" aria-label="Current answer"></div>
            <div class="tl-letters" id="letters" aria-label="Scrambled letters"></div>
            <div class="tl-controls" id="controls"></div>
            <div class="tl-progress" id="progress"></div>
            ${showIntro ? `
              <div class="tl-intro-overlay" id="intro" role="status" aria-live="polite">
                <div class="tl-intro-card">
                  <p class="tl-intro-eyebrow">Get ready</p>
                  <h2>Unscramble the words</h2>
                  <div class="tl-intro-icon">
                    <span aria-hidden="true">🔤</span>
                  </div>
                  <p class="tl-intro-copy">Use each clue and tap the letters in order. Solve all three words to unlock.</p>
                </div>
              </div>` : ""}
          </section>`;
        renderBoard();
        renderAnswer();
        renderLetters();
        renderControls();
        renderProgress();
        updateClue();
      }

      function renderBoard() {
        const boardElement = document.getElementById("board");
        const board = buildBoard();
        const sizing = getBoardSizing(board);
        boardElement.style.setProperty("--cell-size", `${sizing.cellSize}px`);
        boardElement.style.gridTemplateColumns = `repeat(${sizing.cols}, ${sizing.cellSize}px)`;
        boardElement.style.gridTemplateRows = `repeat(${sizing.rows}, ${sizing.cellSize}px)`;
        boardElement.innerHTML = "";
        for (let index = 0; index < sizing.rows * sizing.cols; index += 1) {
          const row = board.minRow + Math.floor(index / sizing.cols);
          const col = board.minCol + index % sizing.cols;
          const entries = board.cellMap.get(`${row},${col}`);
          if (!entries) {
            const spacer = document.createElement("div");
            spacer.className = "tl-board-spacer";
            boardElement.appendChild(spacer);
            continue;
          }
          const button = document.createElement("button");
          const activeCell = entries.some((entry) => entry.wordIndex === activeWord);
          const solvedCell = entries.some((entry) => solved[entry.wordIndex]);
          const wrongCell = wrongWord !== null && entries.some((entry) => entry.wordIndex === wrongWord);
          button.type = "button";
          button.className = "tl-board-cell";
          if (entries.length > 1) button.classList.add("intersection");
          else if (activeCell) button.classList.add("active");
          if (solvedCell) button.classList.add("solved");
          if (wrongCell) button.classList.add("wrong");
          button.textContent = cellLetter(entries).toUpperCase();
          button.setAttribute("aria-label", `Select crossword cell ${row + 1}, ${col + 1}`);
          button.style.setProperty("--active-color", ARM_COLORS[activeWord].active);
          button.style.setProperty("--active-tint", ARM_COLORS[activeWord].dim);
          button.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            selectCell(entries);
          });
          boardElement.appendChild(button);
        }
      }

      function renderAnswer() {
        const word = puzzle.words[activeWord];
        const current = inputs[activeWord];
        const answer = document.getElementById("answer");
        const size = Math.min(38, Math.floor(320 / word.word.length) - 4);
        answer.style.setProperty("--answer-size", `${size}px`);
        answer.innerHTML = "";
        word.word.split("").forEach((_, index) => {
          const tile = current[index];
          const button = document.createElement("button");
          button.type = "button";
          button.className = `tl-answer-slot${tile ? " filled" : ""}`;
          button.textContent = tile ? tile.letter.toUpperCase() : "";
          button.style.setProperty("--active-color", ARM_COLORS[activeWord].active);
          button.style.setProperty("--active-tint", ARM_COLORS[activeWord].dim);
          button.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            if (started && tile && !solved[activeWord]) {
              inputs[activeWord] = current.filter((__, tileIndex) => tileIndex !== index);
              renderGame(false);
            }
          });
          answer.appendChild(button);
        });
      }

      function renderLetters() {
        const current = inputs[activeWord];
        const letters = document.getElementById("letters");
        const colors = ARM_COLORS[activeWord];
        const size = Math.min(44, Math.floor((311 - (scrambled[activeWord].length - 1) * 6) / scrambled[activeWord].length));
        letters.style.setProperty("--tile-size", `${size}px`);
        letters.style.setProperty("--tile-font", size >= 40 ? "17px" : size >= 32 ? "14px" : "12px");
        letters.style.setProperty("--tile-radius", `${Math.max(7, Math.round(size * .25))}px`);
        letters.style.setProperty("--tile-top", colors.tileTop);
        letters.style.setProperty("--tile-bottom", colors.tileBot);
        letters.style.setProperty("--tile-glow", colors.glow);
        letters.innerHTML = "";
        scrambled[activeWord].forEach((tile) => {
          const used = current.some((selected) => selected.idx === tile.idx);
          const button = document.createElement("button");
          button.type = "button";
          button.className = `tl-letter${used || solved[activeWord] ? " used" : ""}`;
          button.disabled = used || solved[activeWord];
          button.textContent = tile.letter.toUpperCase();
          button.setAttribute("aria-label", `Use letter ${tile.letter}`);
          button.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            useTile(tile);
          });
          letters.appendChild(button);
        });
      }

      function renderControls() {
        const current = inputs[activeWord];
        const controls = document.getElementById("controls");
        controls.innerHTML = "";
        [
          { label: "↶ Undo", disabled: current.length === 0, action: undo },
          { label: "↻ Reset", disabled: false, action: reset },
          { label: "⤨ Scramble", disabled: false, action: scramble },
          { label: retryPhase ? "Mark Wrong" : "Skip", disabled: false, action: skip, className: "skip" }
        ].forEach((control) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `tl-control ${control.className || ""}`;
          button.disabled = control.disabled;
          button.textContent = control.label;
          button.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            if (started && !control.disabled) control.action();
          });
          controls.appendChild(button);
        });
      }

      function renderProgress() {
        const progress = document.getElementById("progress");
        progress.innerHTML = "";
        puzzle.words.forEach((_, index) => {
          const dot = document.createElement("div");
          dot.className = "tl-dot";
          dot.style.background = solved[index] ? "#4ade80" : retryQueue.includes(index) ? "#facc15" : index === activeWord ? ARM_COLORS[index].active : ARM_COLORS[index].dim;
          progress.appendChild(dot);
        });
        const count = document.createElement("span");
        count.className = "tl-progress-count";
        count.textContent = `${solved.filter(Boolean).length}/${puzzle.words.length}`;
        progress.appendChild(count);
      }

      function updateClue() {
        document.getElementById("clue").textContent = `💡 ${puzzle.words[activeWord].hint}`;
        const retry = document.getElementById("retry");
        retry.hidden = !retryPhase;
        if (retryPhase) retry.textContent = `Retry — ${retryQueue.length} word${retryQueue.length === 1 ? "" : "s"} left`;
      }

      function showCorrectSplash() {
        const game = document.querySelector(".tl-game");
        if (!game) return;
        const splash = document.createElement("div");
        splash.className = "tl-word-splash";
        splash.textContent = "CORRECT!";
        game.appendChild(splash);
        window.setTimeout(() => splash.remove(), 700);
      }

      function useTile(tile) {
        if (!started || finished || solved[activeWord] || inputs[activeWord].some((selected) => selected.idx === tile.idx)) return;
        inputs[activeWord].push(tile);
        renderGame(false);
        const current = inputs[activeWord];
        const word = puzzle.words[activeWord].word;
        if (current.length !== word.length) return;
        const answer = current.map((selected) => selected.letter).join("").toUpperCase();
        if (answer !== word.toUpperCase()) {
          wrongWord = activeWord;
          renderGame(false);
          window.clearTimeout(transitionId);
          transitionId = window.setTimeout(() => {
            inputs[activeWord] = [];
            wrongWord = null;
            renderGame(false);
          }, 600);
          return;
        }
        solved[activeWord] = true;
        wrongWord = null;
        renderGame(false);
        showCorrectSplash();
        advanceAfterSolve();
      }

      function advanceAfterSolve() {
        window.clearTimeout(transitionId);
        transitionId = window.setTimeout(() => {
          if (retryPhase) {
            retryQueue = retryQueue.filter((index) => index !== activeWord);
            if (retryQueue.length) {
              activeWord = retryQueue[0];
              renderGame(false);
            } else {
              showCompletion();
            }
            return;
          }
          const next = puzzle.words.findIndex((_, index) => index !== activeWord && !solved[index] && !retryQueue.includes(index));
          const firstPassDone = puzzle.words.every((_, index) => solved[index] || retryQueue.includes(index));
          if (next >= 0) {
            activeWord = next;
            renderGame(false);
          } else if (firstPassDone && retryQueue.length) {
            retryPhase = true;
            activeWord = retryQueue[0];
            renderGame(false);
          } else {
            showCompletion();
          }
        }, 650);
      }

      function undo() { inputs[activeWord].pop(); renderGame(false); }
      function reset() { inputs[activeWord] = []; wrongWord = null; renderGame(false); }
      function scramble() { scrambled[activeWord] = shuffleTiles(puzzle.words[activeWord].word); inputs[activeWord] = []; wrongWord = null; renderGame(false); }

      function skip() {
        if (!started || finished || solved[activeWord]) return;
        if (retryPhase) {
          retryQueue = retryQueue.filter((index) => index !== activeWord);
          if (retryQueue.length) {
            activeWord = retryQueue[0];
            renderGame(false);
          } else {
            showCompletion();
          }
          return;
        }
        if (!retryQueue.includes(activeWord)) retryQueue.push(activeWord);
        const next = puzzle.words.findIndex((_, index) => !solved[index] && !retryQueue.includes(index));
        if (next >= 0) {
          activeWord = next;
        } else {
          retryPhase = true;
          activeWord = retryQueue[0];
        }
        renderGame(false);
      }

      function showCompletion() {
        if (finished) return;
        finished = true;
        window.clearTimeout(transitionId);
        const score = solved.filter(Boolean).length;
        app.innerHTML = `
          <div class="tl-complete">
            <div class="tl-unlock-stage" aria-label="Lock opening">
              <div class="tl-unlock-burst"></div>
              <div class="tl-final-lock closed" aria-hidden="true">🔒</div>
              <div class="tl-final-lock open" aria-hidden="true">🔓</div>
            </div>
            <div class="tl-complete-label">Challenge complete</div>
            <h1>Your apps are unlocked</h1>
            <div class="tl-result">
              <p class="tl-score">${score}/${puzzle.words.length} correct</p>
              <p class="tl-rank">You ranked in the top 10% of players!</p>
            </div>
            <p class="tl-tagline">
              <span>Your apps aren't blocked,</span>
              <span>they're Think-Locked!</span>
            </p>
            <a class="tl-action" id="cta" href="#">Get ThinkLock →</a>
          </div>`;
        document.getElementById("cta").href = ctaUrl;
      }

      function clearTimers() {
        window.clearTimeout(introId);
        window.clearTimeout(transitionId);
      }

      window.addEventListener("pagehide", clearTimers);
      renderLockScreen();
    })();
  </script>
</body>
</html>
