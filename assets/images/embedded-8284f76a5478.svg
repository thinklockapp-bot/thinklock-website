<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#1a1f35"/>
  <!-- upper wings -->
  <ellipse cx="32" cy="42" rx="20" ry="16" fill="#E8612A" transform="rotate(-20 32 42)"/>
  <ellipse cx="68" cy="42" rx="20" ry="16" fill="#E8612A" transform="rotate(20 68 42)"/>
  <!-- lower wings -->
  <ellipse cx="32" cy="62" rx="14" ry="10" fill="#F5A020" transform="rotate(20 32 62)"/>
  <ellipse cx="68" cy="62" rx="14" ry="10" fill="#F5A020" transform="rotate(-20 68 62)"/>
  <!-- wing spots -->
  <circle cx="32" cy="40" r="5" fill="#111" opacity="0.4"/>
  <circle cx="68" cy="40" r="5" fill="#111" opacity="0.4"/>
  <!-- body -->
  <ellipse cx="50" cy="52" rx="4" ry="16" fill="#333"/>
  <!-- head -->
  <circle cx="50" cy="35" r="5" fill="#333"/>
  <!-- antennae -->
  <line x1="48" y1="31" x2="40" y2="22" stroke="#333" stroke-width="1.5"/>
  <line x1="52" y1="31" x2="60" y2="22" stroke="#333" stroke-width="1.5"/>
  <circle cx="40" cy="22" r="2" fill="#F5A020"/>
  <circle cx="60" cy="22" r="2" fill="#F5A020"/>
</svg>