name: Install HeyCatch analytics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-heycatch.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add HeyCatch analytics to landing page
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          snippet = """<script type=\"module\">
              import { analytics } from 'https://esm.sh/@heycatch/sdk@0.7.0';
              analytics.init({
                  projectKey: 'hck_pk_uksPscKEqZr2HJoSSIHqGFR5Ae6wIQNF',
                  install: { framework: 'web', agent: 'other' },
              });
          </script>
          """

          if '@heycatch/sdk' not in text:
              if '<style>' not in text:
                  raise SystemExit('Could not find <style> insertion point in index.html')
              text = text.replace('<style>', snippet + '<style>', 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit landing-page analytics
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "HeyCatch analytics already installed; nothing to commit."
            exit 0
          fi
          git config user.name "thinklockapp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Install HeyCatch analytics on landing page"
          git push
