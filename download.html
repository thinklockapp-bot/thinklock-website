<!DOCTYPE html>
<html>
<head>
  <title>Download ThinkLock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
    const ua = navigator.userAgent || navigator.vendor || window.opera;

    if (/android/i.test(ua)) {
      window.location.href = "https://play.google.com/store/apps/details?id=com.thinklock.app";
    } else if (/iPad|iPhone|iPod/.test(ua)) {
      window.location.href = "https://apps.apple.com/us/app/thinklock/id6755414121";
    } else {
      window.location.href = "https://thinklock.net";
    }
  </script>
</head>

<body>

</body>
</html>
