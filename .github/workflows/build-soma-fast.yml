name: Build Soma replacement media fast

on:
  push:
    branches:
      - soma-media-fast-replace
    paths:
      - 'playable-demos/.soma-media-fast-ready'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: soma-media-fast-replace

      - name: Install Python image packages
        run: python -m pip install --quiet pillow numpy

      - name: Generate replacement GIF and MP4
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          cp playable-demos/soma_ufo_flyby_pulse_quiver_v2.gif /tmp/source.gif
          cat > /tmp/build.py <<'PY'
          import math, os, subprocess
          import numpy as np
          from PIL import Image, ImageSequence, ImageDraw, ImageFilter, ImageEnhance, ImageChops

          src_im=Image.open('/tmp/source.gif')
          src_frames=[np.array(f.convert('RGB')) for f in ImageSequence.Iterator(src_im)]
          base_np=src_frames[0]
          H,W=base_np.shape[:2]
          sx=W/720.0; sy=H/900.0

          # Reconstruct a clean Soma UFO sprite from a frame where it is at far left.
          src=src_frames[min(60,len(src_frames)-1)]
          x1=int(240*sx); y0=int(440*sy); y1=int(640*sy)
          c=src[y0:y1,0:x1]; b=base_np[y0:y1,0:x1]
          ch,cw=c.shape[:2]
          diff=np.max(np.abs(c.astype(np.int16)-b.astype(np.int16)),axis=2)
          Y,X=np.mgrid[0:ch,0:cw]
          scx=lambda v:int(v*cw/240); scy=lambda v:int(v*ch/200)
          sil=Image.new('L',(cw,ch),0); d=ImageDraw.Draw(sil)
          d.ellipse((scx(40),scy(8),scx(226),scy(152)),fill=255)
          d.ellipse((scx(4),scy(90),scx(234),scy(183)),fill=255)
          d.ellipse((scx(88),scy(158),scx(158),scy(200)),fill=255)
          sil_np=np.array(sil)>0
          def cream(a):
              a=a.astype(np.int16); r,g,bb=a[:,:,0],a[:,:,1],a[:,:,2]
              return (r>135)&(g>105)&(bb<220)&(r>g*0.92)&(g>bb*0.68)
          def brown(a):
              a=a.astype(np.int16); r,g,bb=a[:,:,0],a[:,:,1],a[:,:,2]
              return (r>45)&(r>g*1.12)&(g>bb*1.05)&(bb<110)
          chg=(diff>25)&sil_np
          chg &= ~(cream(c)&cream(b))
          chg &= ~((brown(c)&brown(b))&(diff<100))
          chg &= ~((X>scx(175))&(Y<scy(105)))
          chg &= ~((Y>scy(178))&~((X>scx(85))&(X<scx(165))))
          cm=Image.fromarray((chg.astype(np.uint8)*255),'L')
          cm=cm.filter(ImageFilter.MaxFilter(3)).filter(ImageFilter.MinFilter(3)).filter(ImageFilter.MaxFilter(3))
          chg=np.array(cm)>0
          rgba=np.zeros((ch,cw,4),dtype=np.uint8)
          dome=Image.new('L',(cw,ch),0); dd=ImageDraw.Draw(dome)
          dd.ellipse((scx(40),scy(8),scx(226),scy(152)),fill=220)
          rgba[:,:,0]=7; rgba[:,:,1]=22; rgba[:,:,2]=42; rgba[:,:,3]=np.array(dome)
          rgba[chg,:3]=c[chg]; rgba[chg,3]=255
          hm=Image.new('L',(cw,ch),0); hd=ImageDraw.Draw(hm)
          hd.ellipse((scx(4),scy(90),scx(234),scy(183)),fill=255)
          hd.ellipse((scx(88),scy(158),scx(158),scy(200)),fill=255)
          hull=np.array(hm)>0
          obj=(diff>16)&~(cream(c)&cream(b))&~((brown(c)&brown(b))&(diff<100))
          obj &= ~((Y>scy(178))&~((X>scx(85))&(X<scx(165))))
          rgba[hull&obj,:3]=c[hull&obj]; rgba[hull&obj,3]=255
          sprite=Image.fromarray(rgba,'RGBA')
          sprite.putalpha(sprite.getchannel('A').filter(ImageFilter.GaussianBlur(0.7)))
          sprite=sprite.crop(sprite.getbbox())
          sprite=sprite.resize((int(sprite.width*1.20),int(sprite.height*1.20)),Image.Resampling.LANCZOS)

          base=Image.fromarray(base_np,'RGB').convert('RGBA')
          r,g,bb=base_np[:,:,0],base_np[:,:,1],base_np[:,:,2]
          tm=((r>150)&(g>118)&(bb<215)&(r>g*0.9)&(g>bb*0.65)).astype(np.uint8)*255
          tm[:int(155*sy),:]=0; tm[int(545*sy):,:]=0
          text_mask=Image.fromarray(tm,'L').filter(ImageFilter.GaussianBlur(max(0.7,sx)))

          btn_box=(int(215*sx),int(525*sy),int(510*sx),int(740*sy))
          btn_base=base.crop(btn_box)
          bn=np.array(btn_base.convert('RGB')); br,bg,bbl=bn[:,:,0],bn[:,:,1],bn[:,:,2]
          red=((br>105)&(br>bg*1.22)&(br>bbl*1.35)).astype(np.uint8)*255
          redmask=Image.fromarray(red,'L').filter(ImageFilter.GaussianBlur(max(1.5,2.2*sx)))

          fps=12; total=84; start_hold=10; end_hold=14
          move=total-start_hold-end_hold
          x_start=W+sprite.width*.7; x_end=-sprite.width*1.1
          cy0=int(560*sy); bob=max(8,int(14*sy))
          ease=lambda t:3*t*t-2*t*t*t
          frames=[]; tmp='/tmp/frames'; os.makedirs(tmp,exist_ok=True)

          for i in range(total):
              fr=base.copy()
              ps=math.sin(2*math.pi*(i/total)*5.0-math.pi/4)
              bright=max(.55,1.10+.50*ps)
              fr=Image.composite(ImageEnhance.Brightness(base).enhance(bright),fr,text_mask)
              if ps>0:
                  gm=text_mask.filter(ImageFilter.GaussianBlur(max(5,int(10*sx))))
                  gm=gm.point(lambda p:int(min(255,p*(.30+.55*ps))))
                  gl=Image.new('RGBA',(W,H),(255,234,170,0)); gl.putalpha(gm); fr.alpha_composite(gl)
                  tm2=text_mask.filter(ImageFilter.GaussianBlur(max(2,int(4*sx))))
                  tm2=tm2.point(lambda p:int(min(255,p*(.12+.30*ps))))
                  tl=Image.new('RGBA',(W,H),(255,250,215,0)); tl.putalpha(tm2); fr.alpha_composite(tl)

              qx=int(round(3*sx*math.sin(i*.95))); qy=int(round(2*sy*math.sin(i*1.35+1.1)))
              moved=ImageChops.offset(btn_base,qx,qy); reg=fr.crop(btn_box)
              fr.paste(Image.composite(moved,reg,redmask),btn_box)

              if start_hold<=i<start_hold+move:
                  t=(i-start_hold)/(move-1); te=ease(t)
                  cx=x_start+(x_end-x_start)*te; cy=cy0+bob*math.sin(t*2*math.pi)
                  angle=2.3*math.sin(t*2*math.pi*1.8); ss=1+.02*math.sin(t*2*math.pi*1.3)
                  sp=sprite.resize((max(1,int(sprite.width*ss)),max(1,int(sprite.height*ss))),Image.Resampling.LANCZOS)
                  sp=sp.rotate(angle,resample=Image.Resampling.BICUBIC,expand=True)
                  px=int(cx-sp.width/2); py=int(cy-sp.height/2)
                  a=sp.getchannel('A').filter(ImageFilter.GaussianBlur(max(4,int(7*sx))))
                  sh=Image.new('RGBA',sp.size,(0,0,0,0)); bk=Image.new('RGBA',sp.size,(0,0,0,90))
                  sh=Image.composite(bk,sh,a)
                  fr.alpha_composite(sh,(px+int(5*sx),py+int(6*sy))); fr.alpha_composite(sp,(px,py))

              rgb=fr.convert('RGB')
              rgb.save(f'{tmp}/f_{i:04d}.jpg',quality=89,subsampling=0)
              frames.append(rgb.convert('P',palette=Image.Palette.ADAPTIVE,colors=96))

          frames[0].save('playable-demos/soma_ufo_flyby_pulse_quiver_v2.gif',save_all=True,append_images=frames[1:],duration=round(1000/fps),loop=0,optimize=False,disposal=2)
          subprocess.run(['ffmpeg','-y','-framerate',str(fps),'-i',f'{tmp}/f_%04d.jpg','-c:v','libx264','-crf','22','-pix_fmt','yuv420p','-movflags','+faststart','playable-demos/soma_ufo_flyby_pulse_quiver_v2.mp4'],check=True)
          PY
          python /tmp/build.py
          test -s playable-demos/soma_ufo_flyby_pulse_quiver_v2.gif
          test -s playable-demos/soma_ufo_flyby_pulse_quiver_v2.mp4

      - name: Commit generated media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thinklockapp-bot'
          git config user.email 'thinklockapp@gmail.com'
          git add playable-demos/soma_ufo_flyby_pulse_quiver_v2.gif playable-demos/soma_ufo_flyby_pulse_quiver_v2.mp4
          git rm playable-demos/.soma-media-fast-ready
          git commit -m 'Build larger Soma media with stronger faster pulse'
          git push origin soma-media-fast-replace
