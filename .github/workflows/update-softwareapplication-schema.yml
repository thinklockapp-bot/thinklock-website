name: Update SoftwareApplication schema

on:
  push:
    paths:
      - .github/workflows/update-softwareapplication-schema.yml

permissions:
  contents: write

jobs:
  update-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update homepage SoftwareApplication schema
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '"description":"Play fast brain games for memory, logic, language and speed with ThinkLock. Complete Daily Challenges and compete in Weekly Tournaments on iOS and Android."'
          new = '"description":"A brain training app with daily cognitive challenges, memory and logic games, rewards and weekly tournaments."'

          if old not in text:
              raise SystemExit('Expected SoftwareApplication schema description was not found.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit schema update and remove temporary workflow
        run: |
          rm .github/workflows/update-softwareapplication-schema.yml
          git config user.name "thinklockapp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/update-softwareapplication-schema.yml
          git commit -m "Update SoftwareApplication schema"
          git push origin main
